trigger:
- main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python38:
      python.version: '3.8'
    Python39:
      python.version: '3.9'
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'

steps:
- task: VisualStudioTestPlatformInstaller@1
  inputs:
    packageFeedSelector: 'nugetOrg'
    versionSelector: 'latestPreRelease'

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    pip install pytest pytest-azurepipelines
    pytest --maxfail=1 --disable-warnings --tb=short --junitxml=pytest-results.xml
  displayName: 'Run tests and generate XML result'

# Publish test results (linking to Azure DevOps Test ID)
- task: PublishTestResults@2
  inputs:
    testResultsFiles: '**/pytest-results.xml'
    testRunTitle: 'Python Unit Tests'
    mergeTestResults: true
    testResultsFormat: 'JUnit'
  displayName: 'Publish test results'

- script: |
    # Simple sum example in Python
    python -c "a = 5; b = 7; result = a + b; print(f'The sum of {a} and {b} is {result}')"
  displayName: 'Run simple sum in Python'